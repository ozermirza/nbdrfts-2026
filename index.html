<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiyat Radarı</title>
<style>
  :root {
    --zemin: #14161a; --yuzey: #1d2026; --yuzey2: #23262d;
    --metin: #e8eaed; --soluk: #9aa0a8; --cizgi: #2d3138;
    --vurgu: #4f8cff; --golge: 0 1px 4px rgba(0,0,0,.4);
  }
  body.acik {
    --zemin: #efe9dd; --yuzey: #faf6ec; --yuzey2: #f3edde;
    --metin: #3d3629; --soluk: #8a7f6a; --cizgi: #ddd3bf;
    --vurgu: #b5713f; --golge: 0 1px 3px rgba(90,75,50,.12);
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--zemin); color: var(--metin); padding: 20px;
         transition: background .2s, color .2s; }
  .ust { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 21px; font-weight: 650; letter-spacing: .2px; }
  .alt { color: var(--soluk); font-size: 13px; margin: 4px 0 18px; }
  .btn { border: 1px solid var(--cizgi); background: var(--yuzey);
         color: var(--metin); border-radius: 8px; padding: 7px 12px;
         font-size: 13px; cursor: pointer; }
  .btn:hover { border-color: var(--vurgu); color: var(--vurgu); }
  .btnMini { border: 1px solid var(--cizgi); background: var(--yuzey2);
             color: var(--soluk); border-radius: 6px; padding: 2px 8px;
             font-size: 11px; cursor: pointer; text-transform: none; }
  .btnMini:hover { border-color: var(--vurgu); color: var(--vurgu); }
  .acButon { border: none; background: none; color: var(--soluk); cursor: pointer;
             font-size: 12px; padding: 0 6px 0 0; }
  .acButon:hover { color: var(--vurgu); }
  .grafikBtn { margin-left: 6px; }

  .kartlar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .kart { background: var(--yuzey); border: 1px solid var(--cizgi);
          border-radius: 12px; padding: 12px 18px; min-width: 140px;
          box-shadow: var(--golge); }
  .kart .sayi { font-size: 24px; font-weight: 650; }
  .kart .etiket { font-size: 12px; color: var(--soluk); margin-top: 2px; }

  .duzen { display: flex; gap: 16px; align-items: flex-start; }
  .panel { background: var(--yuzey); border: 1px solid var(--cizgi);
           border-radius: 12px; padding: 14px; width: 215px; flex-shrink: 0;
           position: sticky; top: 12px; box-shadow: var(--golge); }
  .panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
              color: var(--soluk); margin: 14px 0 6px;
              display: flex; justify-content: space-between; align-items: center;
              gap: 6px; }
  .panel h3:first-child { margin-top: 0; }
  .panel label { display: block; font-size: 13px; padding: 3px 0; cursor: pointer; }
  .panel input[type=checkbox] { accent-color: var(--vurgu); }
  .panel input[type=text] { width: 100%; padding: 7px 9px; border: 1px solid var(--cizgi);
                            border-radius: 7px; font-size: 13px; margin-bottom: 6px;
                            background: var(--yuzey2); color: var(--metin); }
  .grupBtn { display: flex; gap: 4px; }

  .tabloKap { flex: 1; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--yuzey);
          border: 1px solid var(--cizgi); border-radius: 12px; overflow: hidden;
          table-layout: fixed; box-shadow: var(--golge); }
  th { text-align: left; font-size: 12px; color: var(--soluk); padding: 11px 12px;
       border-bottom: 1px solid var(--cizgi); cursor: pointer; position: relative;
       user-select: none; white-space: nowrap; overflow: hidden; }
  th:hover { color: var(--vurgu); }
  th .tutamac { position: absolute; right: 0; top: 0; bottom: 0; width: 6px;
                cursor: col-resize; }
  th:nth-child(1) { width: 13%; }
  th:nth-child(2) { width: 15%; }
  th:nth-child(3) { width: 9%; }
  th:nth-child(4) { width: 14%; }
  th:nth-child(5) { width: 20%; }
  th:nth-child(6) { width: 20%; }
  th:nth-child(7) { width: 9%; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--cizgi); font-size: 14px;
       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr.detay td { background: var(--yuzey2); font-size: 13px; }
  tr.detay td:first-child { padding-left: 28px; color: var(--soluk); }
  .rozet { display: inline-block; padding: 2px 8px; border-radius: 6px;
           font-size: 12px; font-weight: 600; }
  .dusus { background: rgba(35,165,90,.16); color: #3fbf74; }
  .artis { background: rgba(230,170,30,.16); color: #d9a52a; }
  .kapandi { background: rgba(150,155,165,.15); color: var(--soluk); }
  body.acik .dusus { background: #dfeede; color: #2e6b3a; }
  body.acik .artis { background: #f5e5cb; color: #8a5a1a; }
  .hata { color: #d66; font-size: 12px; }
  .fiyat { font-weight: 600; }
  .fiyat a { color: inherit; }
  .adet { color: var(--soluk); font-size: 12px; font-weight: 400; }
  .saticiEtiket { display: inline-block; border: 1px solid var(--cizgi);
                  color: var(--soluk); border-radius: 5px; padding: 0 6px;
                  font-size: 11px; margin-left: 6px; }

  .modalArka { position: fixed; inset: 0; background: rgba(0,0,0,.55);
               display: none; align-items: center; justify-content: center;
               z-index: 50; }
  .modalArka.acikM { display: flex; }
  .modalKutu { background: var(--yuzey); border: 1px solid var(--cizgi);
               border-radius: 14px; padding: 18px; width: min(720px, 94vw);
               box-shadow: 0 8px 40px rgba(0,0,0,.5); }
  .modalUst { display: flex; justify-content: space-between; align-items: center;
              margin-bottom: 6px; gap: 10px; }
  .modalUst .baslik { font-size: 14px; font-weight: 600; overflow: hidden;
                      text-overflow: ellipsis; white-space: nowrap; }
  .aciklamaSatiri { font-size: 12px; color: var(--soluk); margin-bottom: 10px; }
  .aciklamaSatiri .urunRenk { color: var(--vurgu); font-weight: 600; }
  canvas { width: 100%; height: 300px; display: block; }

  @media (max-width: 800px) {
    body { padding: 12px; }
    .duzen { flex-direction: column; }
    .panel { width: 100%; position: static; }
    .panel label { display: inline-block; width: 48%; }
    .kart { min-width: 100px; padding: 10px 12px; flex: 1; }
    .kart .sayi { font-size: 20px; }
    .tabloKap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { min-width: 880px; }
    th .tutamac { display: none; }
    td, th { padding: 8px 10px; font-size: 13px; }
    canvas { height: 220px; }
  }
  .navSatir { display: flex; gap: 16px; align-items: center; margin: 16px 0 14px; }
  .navGrup { display: flex; gap: 8px; width: 217px; flex: none; }
  .navGrup .btn { flex: 1; text-align: center; text-decoration: none; }
  .navSatir > #sifirlaBtn { margin: 0; }
  .aktifSayfa { border-color: var(--vurgu); color: var(--vurgu); font-weight: 600; }
  .rozet.liste { background: transparent; border: 1px solid #e2a93b;
                 color: #e2a93b; }
  .rozet.yeniR { background: rgba(52,192,124,.15); color: #34c07c; }
  .gunlukKutu { background: var(--yuzey); border: 1px solid var(--cizgi);
                border-radius: 12px; box-shadow: var(--golge);
                margin-bottom: 14px; }
  .gunlukKutu > button { width: 100%; text-align: left; border: none;
                background: none; color: var(--metin); font-size: 13px;
                font-weight: 600; padding: 11px 14px; cursor: pointer; }
  .gunlukKutu > button:hover { color: var(--vurgu); }
  .gunlukListe { display: none; max-height: 240px; overflow-y: auto;
                 border-top: 1px solid var(--cizgi); padding: 6px 14px 10px; }
  .gunlukKutu.acikG .gunlukListe { display: block; }
  .olay { font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--cizgi); }
  .olay:last-child { border-bottom: none; }
  #karsIc { max-height: 520px; }
  .karsSecim { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 0 8px; }
  .karsSecim select, .karsSecim input {
    background: var(--yuzey2); color: var(--metin); border: 1px solid var(--cizgi);
    border-radius: 7px; padding: 6px 9px; font-size: 13px; }
  .karsTablo { table-layout: auto; background: transparent; border: none;
               box-shadow: none; min-width: 0; font-size: 13px; margin-bottom: 6px; }
  .karsTablo th { cursor: default; padding: 5px 8px; }
  .karsTablo td { padding: 7px 8px; }
  .karsBaslik { font-size: 13px; font-weight: 650; padding: 8px 0 2px; }
  .karsNot { font-size: 12px; color: var(--soluk); padding: 0 0 6px; }
  .bant { position: relative; height: 24px; background: var(--yuzey2);
          border-radius: 6px; }
  .bantAralik { position: absolute; top: 7px; height: 10px; border-radius: 5px;
                background: rgba(79,140,255,.35); }
  .bantMod { position: absolute; top: 3px; width: 3px; height: 18px;
             border-radius: 2px; background: var(--vurgu); }
  .bantBenim { position: absolute; top: 0; width: 2px; height: 24px;
               background: #34c07c; }
  .bantEksen { display: flex; justify-content: space-between; color: var(--soluk);
               font-size: 11px; margin-top: 3px; }
  .karsLejant { font-size: 12px; color: var(--soluk); padding: 0;
                margin-left: auto; align-self: center; }
  .karsCipler { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .cip { border: 1px solid var(--cizgi); background: var(--yuzey2);
         color: var(--soluk); border-radius: 999px; padding: 5px 11px;
         font-size: 12px; cursor: pointer; }
  .cip:hover { border-color: var(--vurgu); color: var(--vurgu); }
  .cip.secili { border-color: var(--vurgu); color: var(--vurgu); font-weight: 600; }
  .karsTumu td { background: var(--yuzey2); }
  #karsBenim::-webkit-outer-spin-button,
  #karsBenim::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #karsBenim { -moz-appearance: textfield; appearance: textfield; }
</style>
</head>
<body>
  <div class="ust">
    <h1>Fiyat Radarı</h1>
    <button class="btn" id="temaBtn">☀ Açık tema</button>
  </div>
  <div class="alt" id="sonGuncelleme">Veri yükleniyor...</div>

  <div class="kartlar">
    <div class="kart"><div class="sayi" id="kGrup">–</div><div class="etiket">Ürün grubu</div></div>
    <div class="kart"><div class="sayi" id="kKayit">–</div><div class="etiket">Takip edilen kayıt</div></div>
    <div class="kart"><div class="sayi" id="kDusen">–</div><div class="etiket">İndirimli ürün</div></div>
    <div class="kart"><div class="sayi" id="kArtan">–</div><div class="etiket">Grup üstü fiyat</div></div>
    <div class="kart"><div class="sayi" id="kHata">–</div><div class="etiket">Okunamayan</div></div>
  </div>

  <div class="gunlukKutu" id="gunlukKutu">
    <button id="gunlukBtn">📋 Olay günlüğü — son 7 gün</button>

  <div class="gunlukKutu" id="karsKutu">
    <button id="karsBtn">⚖️ Karşılaştırma — kesit bazlı marka konumu</button>
    <div class="gunlukListe" id="karsIc"></div>
  </div>

  <div class="navSatir">
    <div class="navGrup">
      <a class="btn aktifSayfa" href="index.html">Çocuk ürünleri</a>
      <a class="btn" href="yetiskin.html">Yetişkin ürünleri</a>
    </div>
    <button class="btn" id="sifirlaBtn">↺ Sayfayı sıfırla</button>
  </div>

  <div class="duzen">
    <div class="panel">
      <h3>Ara</h3>
      <input type="text" id="fAra" placeholder="seri, model, varyant...">
      <label><input type="checkbox" id="fDegisen"> Sadece değişen/istisnalı</label>
      <div id="filtreAlan"></div>
    </div>
    <div class="tabloKap">
      <table>
        <thead><tr>
          <th data-k="marka">Marka<span class="tutamac"></span></th>
          <th data-k="seri_adi">Seri<span class="tutamac"></span></th>
          <th data-k="hacim">Hacim<span class="tutamac"></span></th>
          <th data-k="platform">Platform<span class="tutamac"></span></th>
          <th data-k="fiyat">Fiyat<span class="tutamac"></span></th>
          <th data-k="degisim">Değişim<span class="tutamac"></span></th>
          <th>Değişim tarihi<span class="tutamac"></span></th>
        </tr></thead>
        <tbody id="tabloGovde"></tbody>
      </table>
    </div>
  </div>

  <div class="modalArka" id="modalArka">
    <div class="modalKutu">
      <div class="modalUst">
        <div class="baslik" id="modalBaslik">Fiyat geçmişi</div>
        <button class="btn" id="modalKapat">✕</button>
      </div>
      <div class="aciklamaSatiri">
        <span class="urunRenk">— ürün fiyatı</span> &nbsp;·&nbsp; - - grup ortak fiyatı
      </div>
      <canvas id="grafik"></canvas>
    </div>
  </div>

<script>
function csvOku(metin) {
  const satirlar = metin.trim().split("\n");
  const basliklar = satirlar[0].split(",").map(b => b.trim());
  return satirlar.slice(1).map(s => {
    const d = s.split(","), k = {};
    basliklar.forEach((b, i) => k[b] = (d[i] || "").trim());
    return k;
  });
}
const tl = x => parseFloat(x).toLocaleString("tr-TR") + " TL";
const kisaTarih = t => t ? t.slice(8, 10) + "." + t.slice(5, 7) + " " + t.slice(11) : "";
const zaman = t => new Date(t.replace(" ", "T")).getTime();
const kimlik = k => [k.url, (k.satici || "").toLowerCase()].join("|");
const grupKimlik = k => [k.marka, k.seri_adi.toLowerCase(), k.hacim, k.platform].join("|");
const digerMi = k => (k.satici || "") === "diger satici";

function linktenModel(url) {
  try {
    let yol = new URL(url).pathname;
    if (yol.includes("/products/")) yol = yol.split("/products/")[1];
    const parca = yol.split("/").filter(Boolean).pop() || "";
    return parca.replace(/-/g, " ").replace(/\s+p \d+$/, "");
  } catch { return ""; }
}
  // Kisa ad sozlugu: urun adinda soldaki kalip gecerse sadece sagdaki gosterilir.
// Yeni model ciktikca buraya satir eklemen yeterli. Cok kelimeliler ustte dursun.
const KISA_ADLAR = [
  ["fairy sparkle", "Fairy Sparkle"], ["mermaid dream", "Mermaid Dream"],
  ["ocean whisper", "Ocean Whisper"], ["firefighter buddy", "Firefighter Buddy"],
  ["swan harmony", "Swan Harmony"], ["bee honey", "Bee Honey"],
  ["jungle jam", "Jungle Jam"], ["fly pal", "Fly Pal"],
  ["space explorer", "Space Explorer"],
  ["koyu pembe", "Koyu Pembe"], ["koyu mor", "Koyu Mor"],
  ["koyu mavi", "Koyu Mavi"],
  ["mermaid", "Mermaid"], ["dino", "Dino"], ["roads", "Roads"],
  ["pembe", "Pembe"], ["mavi", "Mavi"], ["mor", "Mor"],
];

function kisaAd(ham) {
  const kucuk = " " + ham.toLowerCase() + " ";
  let enIyi = null;
  for (const [ara, goster] of KISA_ADLAR) {
    if (kucuk.includes(ara) && (!enIyi || ara.length > enIyi[0].length)) {
      enIyi = [ara, goster];
    }
  }
  if (enIyi) return enIyi[1];
  const m = kucuk.match(/\b(mr|mrs|miss)\.?\s+([a-zçğıöşü]+)/);
  if (m) {
    const bas = s => s.charAt(0).toUpperCase() + s.slice(1);
    return bas(m[1]) + ". " + bas(m[2]);
  }
  const kelimeler = ham.split(/\s+/);
  return kelimeler.length > 5 ? kelimeler.slice(0, 5).join(" ") + "…" : ham;
}
function etiket(k) {
  const v = (k.varyant || "").trim();
  const ham = (v && v.toLowerCase() !== "default title")
    ? v : (linktenModel(k.url) || "(model bilinmiyor)");
  return kisaAd(ham);
}

const BOYUTLAR = { Marka: "marka", Platform: "platform", Hacim: "hacim", "Tür": "tur" };
let gruplar = [], siralama = { k: null, yon: 1 };
const ANA_SATICILAR = ["popcorner", "sipnjoy", "mareas"];
function anaMi(s) {
  if (!s) return true;
  const n = s.toLowerCase().replace(/\s+/g, "");
  return ANA_SATICILAR.some(a => n.includes(a));
}
let durumlar = { marka: {}, platform: {}, hacim: {}, tur: {} };
let acikGruplar = new Set();
let gecmis = new Map();
let grupGecmis = new Map();
let etiketGecmis = new Map();
let sonTurZamani = 0;

const aktif = (b, d) => durumlar[b][d] !== false;

function degisimAni(k) {
  const h = gecmis.get(kimlik(k));
  if (!h || !k.fiyat) return null;
  let i = h.length - 1;
  while (i >= 0 && h[i].fiyat === k.fiyat) i--;
  if (i < 0 || i === h.length - 1) return null;
  return h[i + 1].tarih;
}

function kapanmaAni(k, grupFiyati, gk) {
  if (!k.fiyat || !grupFiyati) return null;
  if (parseFloat(k.fiyat) < parseFloat(grupFiyati)) return null;
  const h = gecmis.get(kimlik(k));
  if (!h) return null;
  let i = h.length - 1;
  while (i >= 0 && h[i].fiyat === k.fiyat) i--;
  if (i < 0) return null;
  if (parseFloat(h[i].fiyat) >= parseFloat(k.fiyat)) return null;
  // eski fiyat, O GUNKU grup moduna gore gercekten indirimli miydi?
  // (degilse bu bir zam yukselisidir, "indirim kapandi" denmez)
  const eskiMod = sonDeger(grupGecmis.get(gk) || [], zaman(h[i].tarih));
  if (!eskiMod || parseFloat(h[i].fiyat) >= parseFloat(eskiMod.fiyat)) return null;
  const an = h[i + 1].tarih;
  return (sonTurZamani - zaman(an)) <= 48 * 3600 * 1000 ? an : null;
}

function kategoriZam(gk, mod) {
  if (!mod) return null;
  const h = grupGecmis.get(gk);
  if (!h || h.length < 2) return null;
  const son = h[h.length - 1].fiyat;
  let i = h.length - 1;
  while (i >= 0 && h[i].fiyat === son) i--;
  if (i < 0) return null;
  if (parseFloat(h[i].fiyat) >= parseFloat(son)) return null;
  const an = h[i + 1].tarih;
  if ((sonTurZamani - zaman(an)) > 120 * 3600 * 1000) return null;   // 5 gun
  return { an, eski: h[i].fiyat, yeni: son };
}

async function baslat() {
  const kayitlar = csvOku(await (await fetch("fiyatlar.csv?" + Date.now())).text());
  try {
    const hb = await fetch("hb_fiyatlar.csv?" + Date.now());
    if (hb.ok) {
      const metin = await hb.text();
      if (metin.trim().split("\n").length > 1) kayitlar.push(...csvOku(metin));
    }
  } catch {}

  const suzulmus = kayitlar.filter(k => anaMi(k.satici));   // farkli satici takip edilmiyor
  kayitlar.length = 0; kayitlar.push(...suzulmus);

  const anaTurlar = [...new Set(kayitlar.filter(k => k.platform !== "Hepsiburada")
                                        .map(k => k.tarih))].sort();
  kayitlar.forEach(k => {
    k.hamTarih = k.tarih;
    if (k.platform === "Hepsiburada" && !anaTurlar.includes(k.tarih)) {
      const uygun = anaTurlar.filter(t => t <= k.tarih);
      if (uygun.length) k.tarih = uygun[uygun.length - 1];
    }
  });

  const turlar = [...new Set(kayitlar.map(k => k.tarih))].sort();
  const sonTur = turlar.at(-1), oncekiTur = turlar.at(-2) || null;
  if (!sonTur) {
    document.getElementById("sonGuncelleme").textContent =
      "Henüz veri yok — robotun ilk turu bekleniyor.";
    return;
  }
  sonTurZamani = zaman(sonTur);

  kayitlar.filter(k => k.fiyat).sort((a, b) => a.tarih.localeCompare(b.tarih))
    .forEach(k => {
      const a = kimlik(k);
      if (!gecmis.has(a)) gecmis.set(a, []);
      gecmis.get(a).push({ tarih: k.tarih, fiyat: k.fiyat });
    });

  const turGrup = new Map();
  kayitlar.forEach(k => {
    if (!k.fiyat || digerMi(k)) return;
    const a = grupKimlik(k) + "@" + k.tarih;
    if (!turGrup.has(a)) turGrup.set(a, {});
    const s = turGrup.get(a);
    s[k.fiyat] = (s[k.fiyat] || 0) + 1;
  });
  [...turGrup.entries()].sort((x, y) => x[0].localeCompare(y[0])).forEach(([a, s]) => {
    const [gk, tarih] = a.split("@");
    const mod = Object.keys(s).sort((p, q) => s[q] - s[p])[0];
    if (!grupGecmis.has(gk)) grupGecmis.set(gk, []);
    grupGecmis.get(gk).push({ tarih, fiyat: mod });
  });
  grupGecmis.forEach(l => l.sort((a, b) => a.tarih.localeCompare(b.tarih)));

  // ---- yardimci haritalar: son kayit, ilk gorulme, etiket gecmisi,
  //      fiyatsiz serinin baslangici (satista_degil / urun_bulunamadi) ----
  const ilkTur = turlar[0];
  const kayitBilgi = new Map(), ilkGorulme = new Map(), durumIlk = new Map();
  etiketGecmis = new Map();
  kayitlar.slice().sort((a, b) => a.tarih.localeCompare(b.tarih)).forEach(k => {
    const a = kimlik(k);
    kayitBilgi.set(a, k);
    if (!ilkGorulme.has(a)) ilkGorulme.set(a, k.tarih);
    const lf = parseFloat(k.kategori1);
    if (lf > 0) {
      if (!etiketGecmis.has(a)) etiketGecmis.set(a, []);
      etiketGecmis.get(a).push({ tarih: k.tarih, fiyat: String(lf) });
    }
    if (k.fiyat) durumIlk.delete(a);
    else if (!durumIlk.has(a)) durumIlk.set(a, k.tarih);
  });
  const taze = t => t && (sonTurZamani - zaman(t)) <= 72 * 3600 * 1000;
  // ay basinda dosya sifirlanir: kurulusun ilk 48 saatinde gorulenler "yeni" sayilmaz
  const gercektenYeni = t => t && t !== ilkTur
    && (zaman(t) - zaman(ilkTur)) > 48 * 3600 * 1000;

  const sonHam = kayitlar.filter(k => k.tarih === sonTur);
  const enIyi = new Map();
  sonHam.forEach(k => {
    const a = kimlik(k);
    const e = enIyi.get(a);
    if (!e) { enIyi.set(a, k); return; }
    const kF = !!k.fiyat, eF = !!e.fiyat;
    if (kF && !eF) enIyi.set(a, k);
    else if (kF === eF && (k.hamTarih || "") > (e.hamTarih || "")) enIyi.set(a, k);
  });
  const son = [...enIyi.values()];
  const onceki = new Map(kayitlar.filter(k => k.tarih === oncekiTur)
                                 .map(k => [kimlik(k), k]));
  son.forEach(k => {
    k.yon = ""; k.oncekiFiyat = null;
    const e = onceki.get(kimlik(k));
    if (e && e.fiyat && k.fiyat) {
      const ef = parseFloat(e.fiyat), yf = parseFloat(k.fiyat);
      if (yf < ef) { k.yon = "dusus"; k.oncekiFiyat = ef; }
      if (yf > ef) { k.yon = "artis"; k.oncekiFiyat = ef; }
    }
  });

  son.forEach(k => {
    const a = kimlik(k);
    const ilk = ilkGorulme.get(a);
    k.yeniAn = null;   // yeni urun rozeti KAPALI (kullanici karari, 14.08);
    // acmak icin: k.yeniAn = (gercektenYeni(ilk) && taze(ilk)) ? ilk : null;
    void ilk;
    k.durumBas = k.fiyat ? null : (durumIlk.get(a) || k.tarih);
  });
  const yeniSayac = new Map();
  son.forEach(k => {
    if (!k.yeniAn) return;
    const a = grupKimlik(k) + "@" + k.yeniAn;
    yeniSayac.set(a, (yeniSayac.get(a) || 0) + 1);
  });
  son.forEach(k => {
    if (k.yeniAn && yeniSayac.get(grupKimlik(k) + "@" + k.yeniAn) >= 5)
      k.yeniAn = null;   // toplu gelis: gercek yenilik degil, rozet yagmuru olmasin
  });
  // satista_degil BIR KEZ yazilir; sonraki turlarda kaydi olmayan taze
  // kalkanlar tabloda 3 gun gorunsun diye son listesine eklenir
  const sonKimlikler = new Set(son.map(kimlik));
  durumIlk.forEach((t, a) => {
    if (sonKimlikler.has(a) || !taze(t)) return;
    const k = kayitBilgi.get(a);
    if (!k || k.fiyat) return;
    k.yon = ""; k.oncekiFiyat = null; k.kapandi = null;
    k.yeniAn = null; k.durumBas = t;
    son.push(k);
  });

  const sozluk = new Map();
  son.forEach(k => {
    if (!sozluk.has(grupKimlik(k))) sozluk.set(grupKimlik(k), []);
    sozluk.get(grupKimlik(k)).push(k);
  });
  gruplar = [...sozluk.entries()].map(([anahtar, uyeler]) => {
    const ilk = uyeler[0];
    const anaUyeler = uyeler.filter(u => !digerMi(u) &&
      (u.fiyat || taze(u.durumBas)));   // bayat fiyatsizlar gizlenir (3 gun)
    const digerUyeler = uyeler.filter(digerMi);
    const fiyatli = anaUyeler.filter(u => u.fiyat);
    const sayac = {};
    fiyatli.forEach(u => sayac[u.fiyat] = (sayac[u.fiyat] || 0) + 1);
    const mod = Object.keys(sayac).sort((a, b) => sayac[b] - sayac[a])[0] || null;
    const cokFiyatli = fiyatli.length >= 4 &&
      (sayac[mod] || 0) < fiyatli.length / 2;   // mod cogunlugu temsil etmiyor
    // gosterilen grup fiyati: uyenin etiket fiyati (kategori1) varsa o,
    // yoksa satis fiyati; modu alinir. Rozetler/grafik satis moduna bagli kalir.
    const refSayac = {};
    fiyatli.forEach(u => {
      const lf = parseFloat(u.kategori1);
      const ref = (lf > 0 && lf > parseFloat(u.fiyat)) ? String(lf) : u.fiyat;
      refSayac[ref] = (refSayac[ref] || 0) + 1;
    });
    const gosterFiyat = Object.keys(refSayac)
      .sort((a, b) => refSayac[b] - refSayac[a])[0] || null;
    anaUyeler.forEach(u => u.kapandi = cokFiyatli ? null : kapanmaAni(u, mod, anahtar));
    // satistan kalkanlar kapali gorunumde SAKLANIR, grup acilinca gorunur
    const istisnalar = cokFiyatli
      ? anaUyeler.filter(u => u.yon || u.kapandi)
      : anaUyeler.filter(u => (u.fiyat && u.fiyat !== mod) || u.yon || u.kapandi);
    return {
      anahtar,
      marka: ilk.marka, seri_adi: ilk.seri_adi, hacim: ilk.hacim,
      platform: ilk.platform, tur: (ilk.kategori2 || "").toLowerCase(),
      fiyat: mod, gosterFiyat, adet: anaUyeler.length, cokFiyatli,
      minF: fiyatli.length ? Math.min(...fiyatli.map(u => parseFloat(u.fiyat))) : null,
      maxF: fiyatli.length ? Math.max(...fiyatli.map(u => parseFloat(u.fiyat))) : null,
      kategoriZam: cokFiyatli ? null : kategoriZam(anahtar, mod),
      durum: fiyatli.length ? "ok" : ilk.durum,
      url: ilk.url, anaUyeler, digerUyeler, istisnalar,
      degisenSayi: uyeler.filter(u => u.yon && anaMi(u.satici)).length
    };
  }).filter(g => g.anaUyeler.length + g.digerUyeler.length > 0);

  // ---- OLAY GUNLUGU (son 7 gun) ----
  const SON7 = sonTurZamani - 7 * 24 * 3600 * 1000;
  const adBul = a => {
    const kb = kayitBilgi.get(a);
    if (!kb) return a;
    const ad = etiket(kb);
    const on = ad.toLowerCase().startsWith((kb.marka || "").toLowerCase())
      ? "" : kb.marka + " ";   // ad zaten markayla basliyorsa tekrar yazma
    return `${on}${ad} · ${kb.platform}`;
  };
  const olaylar = [];
  // marka + tur + yon bazinda TEK satir: "Trixie — 18 üründe zam" gibi.
  // Detay merakli grup satirindaki grafikten bakar (kullanici karari, 14.08).
  const markaToplu = new Map();
  gecmis.forEach((h, a) => {
    for (let i = 1; i < h.length; i++) {
      if (h[i].fiyat === h[i - 1].fiyat || zaman(h[i].tarih) < SON7) continue;
      const kb = kayitBilgi.get(a);
      const marka = kb ? kb.marka : "?";
      const artis = parseFloat(h[i].fiyat) > parseFloat(h[i - 1].fiyat);
      const anah = [marka, h[i].tarih, artis ? "z" : "i"].join("~");
      if (!markaToplu.has(anah))
        markaToplu.set(anah, { an: h[i].tarih, marka, artis, uyeler: [],
                               eski: h[i - 1].fiyat, yeni: h[i].fiyat, ilkA: a });
      markaToplu.get(anah).uyeler.push(a);
    }
  });
  markaToplu.forEach(o => {
    const tip = o.artis ? "zam" : "indirim";
    const metin = o.uyeler.length === 1
      ? `${adBul(o.ilkA)}: ${tl(o.eski)} → ${tl(o.yeni)}`
      : `${o.marka} — ${o.uyeler.length} üründe ${tip}`;
    olaylar.push({ an: o.an, tip, metin });
  });
  // "takibe girdi" olaylari KAPALI (kullanici karari, 14.08) —
  // gunlugu bogdugu icin yeni urun bildirimi uretmiyoruz.
  const kalkanGrup = new Map();
  durumIlk.forEach((t, a) => {
    if (ilkGorulme.get(a) === ilkTur || zaman(t) < SON7) return;
    const kb = kayitBilgi.get(a);
    const anah = (kb ? grupKimlik(kb) : a) + "@" + t;
    if (!kalkanGrup.has(anah)) kalkanGrup.set(anah, { an: t, kb, uyeler: [] });
    kalkanGrup.get(anah).uyeler.push(a);
  });
  kalkanGrup.forEach(o => {
    if (o.uyeler.length >= 3 && o.kb)
      olaylar.push({ an: o.an, tip: "kalkti",
        metin: `${o.kb.marka} ${o.kb.seri_adi} ${o.kb.hacim} · ${o.kb.platform} — ${o.uyeler.length} kayıt satıştan kalktı` });
    else o.uyeler.forEach(a =>
      olaylar.push({ an: o.an, tip: "kalkti", metin: adBul(a) + " satıştan kalktı" }));
  });
  olaylar.sort((a, b) => b.an.localeCompare(a.an));
  const TIPLER = { zam: ["artis", "zam"], indirim: ["dusus", "indirim"],
                   yeni: ["yeniR", "yeni"], kalkti: ["kapandi", "kalktı"] };
  document.getElementById("gunlukBtn").textContent =
    `📋 Olay günlüğü — son 7 gün (${olaylar.length})`;
  document.getElementById("gunlukListe").innerHTML = olaylar.length
    ? olaylar.map(o => `<div class="olay"><span class="adet">${kisaTarih(o.an)}</span>
        <span class="rozet ${TIPLER[o.tip][0]}">${TIPLER[o.tip][1]}</span> ${o.metin}</div>`).join("")
    : `<div class="olay">Son 7 günde kayda değer olay yok.</div>`;
  document.getElementById("gunlukBtn").addEventListener("click", () =>
    document.getElementById("gunlukKutu").classList.toggle("acikG"));

  karsKur();

  document.getElementById("sonGuncelleme").textContent =
    "Son güncelleme: " + sonTur + " · robot her saat XX:23'te tarar (01-05 hariç)";

  document.getElementById("fAra").addEventListener("input", ciz);
  document.getElementById("fDegisen").addEventListener("input", ciz);
  document.querySelectorAll("th[data-k]").forEach(th =>
    th.addEventListener("click", e => {
      if (e.target.classList.contains("tutamac")) return;
      siralama.yon = siralama.k === th.dataset.k ? -siralama.yon : 1;
      siralama.k = th.dataset.k; ciz();
    }));
  document.getElementById("sifirlaBtn").addEventListener("click", () => {
    acikGruplar.clear();
    durumlar = { marka: {}, platform: {}, hacim: {}, tur: {} };
    document.getElementById("fAra").value = "";
    document.getElementById("fDegisen").checked = false;
    siralama = { k: null, yon: 1 };
    ciz();
  });
  document.getElementById("modalKapat").addEventListener("click", modalKapat);
  document.getElementById("modalArka").addEventListener("click", e => {
    if (e.target.id === "modalArka") modalKapat();
  });
  sutunGenislet();
  temaKur();
  ciz();
}

// ---- KARSILASTIRMA PANELI: ayni hacim+tur kesitinde markalarin konumu ----
let karsSecili = new Set();   // secili hacim cipleri
function karsKur() {
  const hacimler = [...new Set(gruplar.map(g => g.hacim).filter(Boolean))]
    .sort((a, b) => parseInt(a) - parseInt(b));
  const turler = [...new Set(gruplar.map(g => g.tur).filter(Boolean))].sort();
  const platformlar = [...new Set(gruplar.map(g => g.platform).filter(Boolean))].sort();
  const ic = document.getElementById("karsIc");
  ic.innerHTML = `
    <div class="karsSecim">
      <select id="karsTur"></select>
      <div id="karsHacimler" class="karsCipler"></div>
      <select id="karsPlatform"></select>
      <input type="number" id="karsBenim" placeholder="24Bottles fiyat dene (TL)"
             style="width:190px">
      <div class="karsLejant"><b style="color:var(--vurgu)">│</b> grup fiyatı
        &nbsp; ▬ min–max satış aralığı
        &nbsp; <b style="color:#34c07c">│</b> denediğin fiyat</div>
    </div>
    <div id="karsCikti"></div>`;
  const doldur = (id, liste, hepsiEtiketi) => {
    const e = document.getElementById(id);
    const eskiSecim = e.value;
    e.innerHTML =
      (hepsiEtiketi ? `<option value="">${hepsiEtiketi}</option>` : "") +
      liste.map(d => `<option value="${d}">${d}</option>`).join("");
    if (liste.includes(eskiSecim) || (hepsiEtiketi && eskiSecim === ""))
      e.value = eskiSecim;   // gecerliyse secimi koru
  };
  // kaskad: tur secimi hacim ciplerini, tur+hacimler platformlari daraltir.
  // Hacimler CIP: birden fazlasi secilebilir (450+500+550 tek panelde).
  const hacimListesi = () => {
    const t = document.getElementById("karsTur").value;
    return [...new Set(gruplar.filter(g => g.tur === t && g.hacim)
                              .map(g => g.hacim))]
      .sort((a, b) => parseInt(a) - parseInt(b));
  };
  const platformListesi = () => {
    const t = document.getElementById("karsTur").value;
    return [...new Set(gruplar.filter(g => g.tur === t && karsSecili.has(g.hacim))
                              .map(g => g.platform))].sort();
  };
  const cipCiz = () => {
    const liste = hacimListesi();
    karsSecili = new Set([...karsSecili].filter(h => liste.includes(h)));
    if (!karsSecili.size && liste.length) karsSecili.add(liste[0]);
    document.getElementById("karsHacimler").innerHTML = liste.map(h =>
      `<button class="cip${karsSecili.has(h) ? " secili" : ""}" data-h="${h}">${h}</button>`
    ).join("");
    document.querySelectorAll("#karsHacimler .cip").forEach(b =>
      b.addEventListener("click", () => {
        const h = b.dataset.h;
        if (karsSecili.has(h)) {
          if (karsSecili.size > 1) karsSecili.delete(h);   // en az bir hacim kalir
        } else karsSecili.add(h);
        cipCiz();
        doldur("karsPlatform", platformListesi(), "tüm platformlar");
        karsCiz();
      }));
  };
  doldur("karsTur", turler);
  cipCiz();
  doldur("karsPlatform", platformListesi(), "tüm platformlar");
  document.getElementById("karsTur").addEventListener("input", () => {
    cipCiz();
    doldur("karsPlatform", platformListesi(), "tüm platformlar");
    karsCiz();
  });
  for (const id of ["karsPlatform", "karsBenim"])
    document.getElementById(id).addEventListener("input", karsCiz);
  document.getElementById("karsBtn").addEventListener("click", () =>
    document.getElementById("karsKutu").classList.toggle("acikG"));
  karsCiz();
}

function karsCiz() {
  const t = document.getElementById("karsTur").value;
  const p = document.getElementById("karsPlatform").value;
  const benim = parseFloat(document.getElementById("karsBenim").value) || null;
  const hBaslik = [...karsSecili]
    .sort((a, b) => parseInt(a) - parseInt(b)).join(" + ");
  const platformlar = p ? [p]
    : [...new Set(gruplar.filter(g => karsSecili.has(g.hacim) && g.tur === t)
                         .map(g => g.platform))].sort();
  const paneller = [];
  for (const plat of platformlar) {
    const kesit = gruplar.filter(g =>
      karsSecili.has(g.hacim) && g.tur === t && g.platform === plat);
    const markalar = new Map();
    kesit.forEach(g => {
      if (!markalar.has(g.marka))
        markalar.set(g.marka, { fiyatlar: [], referanslar: {}, adet: 0 });
      const m = markalar.get(g.marka);
      g.anaUyeler.forEach(u => {
        if (!u.fiyat) return;
        m.adet++;
        m.fiyatlar.push(parseFloat(u.fiyat));
        const lf = parseFloat(u.kategori1);
        const ref = (lf > 0 && lf > parseFloat(u.fiyat)) ? String(lf) : u.fiyat;
        m.referanslar[ref] = (m.referanslar[ref] || 0) + 1;
      });
    });
    const satirlar = [...markalar.entries()].map(([marka, m]) => {
      if (!m.fiyatlar.length) return null;
      const mod = parseFloat(Object.keys(m.referanslar)
        .sort((a, b) => m.referanslar[b] - m.referanslar[a])[0]);
      return { marka, mod, min: Math.min(...m.fiyatlar),
               max: Math.max(...m.fiyatlar), adet: m.adet };
    }).filter(Boolean).sort((a, b) => a.marka.localeCompare(b.marka, "tr"));
    const tumFiyatlar = [...markalar.values()].flatMap(m => m.fiyatlar);
    if (satirlar.length) paneller.push([plat, satirlar, tumFiyatlar]);
  }
  const kutu = document.getElementById("karsCikti");
  if (!paneller.length) {
    kutu.innerHTML = `<div class="karsNot">Bu kesitte takip edilen ürün yok.</div>`;
    return;
  }
  kutu.innerHTML = paneller.map(([plat, satirlar, tumF]) => {
    const hepsi = satirlar.flatMap(s => [s.min, s.max, s.mod]);
    if (benim) hepsi.push(benim);
    const lo = Math.min(...hepsi) * 0.95, hi = Math.max(...hepsi) * 1.05;
    const x = f => ((f - lo) / (hi - lo) * 100).toFixed(1) + "%";
    const gen = f => (f / (hi - lo) * 100).toFixed(1) + "%";
    const ort = tumF.reduce((a, b) => a + b, 0) / tumF.length;
    const tMin = Math.min(...tumF), tMax = Math.max(...tumF);
    return `
      <div class="karsBaslik">${hBaslik} · ${t} · ${plat}</div>
      <div class="karsNot">${satirlar.length} marka · ${satirlar.reduce((a, s) => a + s.adet, 0)} fiyatlı kayıt</div>
      <table class="karsTablo">
        <tr><th>Marka</th><th>Grup fiyatı</th><th>En düşük</th>
            <th style="width:45%">Fiyat konumu</th></tr>
        <tr class="karsTumu">
          <td><b>Tümü</b> <span class="adet">(${tumF.length})</span></td>
          <td title="kesitteki tüm fiyatlı kayıtların ortalaması">ort. ${tl(Math.round(ort))}</td>
          <td>${tl(tMin)} – ${tl(tMax)}</td>
          <td><div class="bant">
            <div class="bantAralik" style="left:${x(tMin)};width:${gen(tMax - tMin)}"></div>
            <div class="bantMod" style="left:${x(ort)}" title="ortalama"></div>
            ${benim ? `<div class="bantBenim" style="left:${x(benim)}"></div>` : ""}
          </div>
          <div class="bantEksen"><span>${tl(Math.round(lo))}</span><span>${tl(Math.round(hi))}</span></div></td>
        </tr>
        ${satirlar.map(s => `
        <tr>
          <td><b>${s.marka}</b> <span class="adet">(${s.adet})</span></td>
          <td>${tl(s.mod)}</td>
          <td>${s.min < s.mod ? tl(s.min) : "—"}</td>
          <td><div class="bant">
            <div class="bantAralik" style="left:${x(s.min)};width:${gen(s.max - s.min)}"></div>
            <div class="bantMod" style="left:${x(s.mod)}"></div>
            ${benim ? `<div class="bantBenim" style="left:${x(benim)}"></div>` : ""}
          </div>
          <div class="bantEksen"><span>${tl(Math.round(lo))}</span><span>${tl(Math.round(hi))}</span></div></td>
        </tr>`).join("")}
      </table>`;
  }).join("");
}

function modalKapat() {
  document.getElementById("modalArka").classList.remove("acikM");
}

function secenekler(boyut) {
  const uygun = gruplar.filter(g =>
    Object.values(BOYUTLAR).every(b => b === boyut || aktif(b, g[b])));
  return [...new Set(uygun.map(g => g[boyut]))].sort();
}

function panelCiz() {
  const alan = document.getElementById("filtreAlan");
  alan.innerHTML = Object.entries(BOYUTLAR).map(([baslikAd, boyut]) => {
    const kutular = secenekler(boyut).map(d =>
      `<label><input type="checkbox" data-boyut="${boyut}" value="${d}"
        ${aktif(boyut, d) ? "checked" : ""}> ${d}</label>`).join("");
    return `<h3>${baslikAd}
      <span class="grupBtn">
        <button class="btnMini" data-tum="${boyut}">tümü</button>
        <button class="btnMini" data-temizle="${boyut}">temizle</button>
      </span></h3>${kutular || '<span class="adet">seçenek yok</span>'}`;
  }).join("");

  alan.querySelectorAll("input[data-boyut]").forEach(k =>
    k.addEventListener("change", () => {
      durumlar[k.dataset.boyut][k.value] = k.checked; ciz();
    }));
  alan.querySelectorAll("[data-tum]").forEach(b =>
    b.addEventListener("click", () => {
      secenekler(b.dataset.tum).forEach(d => durumlar[b.dataset.tum][d] = true);
      ciz();
    }));
  alan.querySelectorAll("[data-temizle]").forEach(b =>
    b.addEventListener("click", () => {
      secenekler(b.dataset.temizle).forEach(d => durumlar[b.dataset.temizle][d] = false);
      ciz();
    }));
}

function detaySatiri(d, g) {
  let rozet = "", tarihH = "";
  const gf = g.gosterFiyat || g.fiyat;   // uye kiyaslari gosterilen fiyata gore
  const an = kisaTarih(degisimAni(d));
  if (!d.fiyat && d.durumBas) {
    rozet = `<span class="rozet kapandi">satıştan kalktı</span>`;
    tarihH = kisaTarih(d.durumBas);
  } else if (d.kapandi) {
    rozet = `<span class="rozet kapandi">indirim kapandı</span>`;
    tarihH = kisaTarih(d.kapandi);
  } else if (d.yon === "dusus") {
    rozet = `<span class="rozet dusus">▼ ${tl(d.oncekiFiyat)} → ${tl(d.fiyat)}</span>`;
    tarihH = an || "";
  } else if (d.yon === "artis") {
    rozet = `<span class="rozet artis">▲ ${tl(d.oncekiFiyat)} → ${tl(d.fiyat)}</span>`;
    tarihH = an || "";
  } else if (d.fiyat && gf && !g.cokFiyatli
             && parseFloat(d.fiyat) !== parseFloat(gf)) {
    const dus = parseFloat(d.fiyat) < parseFloat(gf);
    rozet = `<span class="rozet ${dus ? "dusus" : "artis"}">${dus ? "▼" : "▲"} ${tl(gf)} → ${tl(d.fiyat)}</span>`;
    tarihH = an || "";
  }
  if (d.yeniAn) {
    rozet = `<span class="rozet yeniR">yeni ürün</span> ` + rozet;
    if (!tarihH) tarihH = kisaTarih(d.yeniAn);
  }
  let yuzdeH = "";
  const listeF = parseFloat(d.kategori1);
  if (d.fiyat && listeF > 0 && listeF > parseFloat(d.fiyat)) {
    const ind = (1 - parseFloat(d.fiyat) / listeF) * 100;
    yuzdeH += ` <span class="rozet liste" title="satıcı etiket fiyatı ${tl(listeF)}">-%${ind.toFixed(0)} etiket</span>`;
  }
  if (d.fiyat && gf && !g.cokFiyatli && parseFloat(gf) > 0
      && parseFloat(d.fiyat) !== parseFloat(gf)) {
    const oran = (parseFloat(d.fiyat) - parseFloat(gf)) / parseFloat(gf) * 100;
    const ipucu = (listeF > 0) ? ` title="satıcı etiket fiyatı ${tl(listeF)}"` : "";
    yuzdeH = ` <span class="rozet ${oran < 0 ? "dusus" : "artis"}"${ipucu}>${oran < 0 ? "-" : "+"}%${Math.abs(oran).toFixed(0)}</span>`;   // satirda tek yuzde: grup konumu oncelikli, etiket tooltip'te
  }
  const saticiHtml = d.satici ? `<span class="saticiEtiket">${d.satici}</span>` : "";
  const gBtn = `<button class="btnMini grafikBtn" data-kim="${encodeURIComponent(kimlik(d))}"
    data-grup="${encodeURIComponent(g.anahtar)}" data-ad="${etiket(d).replace(/"/g, "&quot;")}">📈</button>`;
  return `<tr class="detay">
    <td>↳ model</td>
    <td colspan="3"><a href="${d.url}" target="_blank" style="color:inherit">${etiket(d)}</a>${saticiHtml}${gBtn}</td>
    <td class="fiyat"><a href="${d.url}" target="_blank">${d.fiyat ? tl(d.fiyat) : d.durum}</a>${yuzdeH}</td>
    <td>${rozet}</td>
    <td class="adet">${tarihH || "—"}</td></tr>`;
}

function ciz() {
  panelCiz();
  const ara = document.getElementById("fAra").value.toLowerCase();
  const sadeceDegisen = document.getElementById("fDegisen").checked;

  let liste = gruplar.filter(g =>
    Object.values(BOYUTLAR).every(b => aktif(b, g[b])) &&
    (!sadeceDegisen || g.degisenSayi > 0 || g.istisnalar.length > 0 || g.kategoriZam) &&
    (!ara || (g.marka + " " + g.seri_adi + " " +
              g.anaUyeler.concat(g.digerUyeler).map(etiket).join(" "))
              .toLowerCase().includes(ara))
  );

  document.getElementById("kGrup").textContent = liste.length;
  let kayitSay = 0, indirimli = 0, grupUstu = 0, hatali = 0;
  liste.forEach(g => {
    const uyeler = g.anaUyeler.concat(g.digerUyeler);
    kayitSay += uyeler.length;
    hatali += uyeler.filter(u => u.durum !== "ok").length;
    g.anaUyeler.forEach(u => {
      if (!u.fiyat || !(g.gosterFiyat || g.fiyat) || g.cokFiyatli || !anaMi(u.satici)) return;
      const f = parseFloat(u.fiyat), m = parseFloat(g.gosterFiyat || g.fiyat);
      if (f < m || u.yon === "dusus") indirimli++;
      else if (f > m || u.yon === "artis") grupUstu++;
    });
  });
  document.getElementById("kKayit").textContent = kayitSay;
  document.getElementById("kDusen").textContent = indirimli;
  document.getElementById("kArtan").textContent = grupUstu;
  document.getElementById("kHata").textContent = hatali;

  if (siralama.k) {
    liste = [...liste].sort((a, b) => {
      if (siralama.k === "degisim")
        return (b.degisenSayi + b.istisnalar.length / 100
              - a.degisenSayi - a.istisnalar.length / 100) * siralama.yon;
      const x = a[siralama.k] || "", y = b[siralama.k] || "";
      const nx = parseFloat(x), ny = parseFloat(y);
      const s = (!isNaN(nx) && !isNaN(ny)) ? nx - ny
              : String(x).localeCompare(String(y), "tr");
      return s * siralama.yon;
    });
  } else {
    liste = [...liste].sort((a, b) =>
      a.marka.localeCompare(b.marka, "tr")
      || a.seri_adi.localeCompare(b.seri_adi, "tr")
      || String(a.hacim).localeCompare(String(b.hacim), "tr"));
  }

  document.getElementById("tabloGovde").innerHTML = liste.map(g => {
    const acik = acikGruplar.has(g.anahtar);
    const gf = g.gosterFiyat || g.fiyat;
    let grupIndH = "";
    if (!g.cokFiyatli && g.fiyat && gf && parseFloat(g.fiyat) < parseFloat(gf)) {
      const gi = (1 - parseFloat(g.fiyat) / parseFloat(gf)) * 100;
      grupIndH = ` <span class="rozet dusus" title="güncel satış fiyatı modu ${tl(g.fiyat)} — etiket fiyatına göre indirim">-%${gi.toFixed(0)}</span>`;
    }
    const fiyatH = g.cokFiyatli
      ? `<a href="${g.url}" target="_blank">${tl(g.minF)} – ${tl(g.maxF)}</a>`
      : (gf
        ? `<a href="${g.url}" target="_blank">${tl(gf)}</a>`
        : `<span class="hata">${g.durum}</span>`);
    const detaylar = acik ? g.anaUyeler : g.istisnalar;
    const detayNotu = acik
      ? `<span class="adet">▾ tümü açık</span>`
      : (detaylar.length ? `<span class="adet">${detaylar.length} detay ↓</span>` : "");
    const grupGBtn = `<button class="btnMini grafikBtn" data-kim=""
      data-grup="${encodeURIComponent(g.anahtar)}"
      data-ad="${(g.marka + " " + g.seri_adi + " " + g.hacim + " grup fiyatı").replace(/"/g, "&quot;")}">📈</button>`;
    const zamH = g.kategoriZam
      ? ` <span class="rozet artis">gruba zam yapıldı ▲ ${tl(g.kategoriZam.eski)} → ${tl(g.kategoriZam.yeni)}</span>`
      : "";
    let satirlar = `<tr>
      <td><button class="acButon" data-g="${g.anahtar}">${acik ? "▾" : "▸"}</button>${g.marka}</td>
      <td>${g.seri_adi}</td><td>${g.hacim}</td>
      <td>${g.platform}</td>
      <td class="fiyat">${fiyatH}${grupIndH} <span class="adet">(${g.adet} varyant)</span>${grupGBtn}</td>
      <td>${zamH}${zamH && detayNotu ? " " : ""}${detayNotu}</td>
      <td>${g.kategoriZam ? kisaTarih(g.kategoriZam.an) : ""}</td>
    </tr>`;
    detaylar.forEach(d => satirlar += detaySatiri(d, g));
    return satirlar;
  }).join("");

  document.querySelectorAll(".acButon").forEach(b =>
    b.addEventListener("click", () => {
      const g = b.dataset.g;
      acikGruplar.has(g) ? acikGruplar.delete(g) : acikGruplar.add(g);
      ciz();
    }));
  document.querySelectorAll(".grafikBtn").forEach(b =>
    b.addEventListener("click", () =>
      grafikAc(decodeURIComponent(b.dataset.kim), decodeURIComponent(b.dataset.grup),
               b.dataset.ad)));
}

function sonDeger(liste, z) {
  let s = null;
  for (const n of liste) {
    if (zaman(n.tarih) <= z) s = n; else break;
  }
  return s;
}

function grafikAc(kim, grupAnahtari, baslik, isaret = null) {
  const urunH = kim ? (gecmis.get(kim) || []) : [];
  const grupH = grupGecmis.get(grupAnahtari) || [];
  const etikH = kim ? (etiketGecmis.get(kim) || []) : [];
  if (!urunH.length && !grupH.length) return;

  document.getElementById("modalBaslik").textContent = baslik;
  document.getElementById("modalArka").classList.add("acikM");

  const c = document.getElementById("grafik");
  const dpr = window.devicePixelRatio || 1;
  const W = c.clientWidth, H = c.clientHeight;
  c.width = W * dpr; c.height = H * dpr;
  const x = c.getContext("2d");
  x.scale(dpr, dpr);
  x.clearRect(0, 0, W, H);

  const stil = getComputedStyle(document.body);
  const rSoluk = stil.getPropertyValue("--soluk").trim();
  const rVurgu = stil.getPropertyValue("--vurgu").trim();
  const rCizgi = stil.getPropertyValue("--cizgi").trim();

  const hepsi = urunH.concat(grupH, etikH);
  const t0 = Math.min(...hepsi.map(n => zaman(n.tarih)));
  const t1 = Math.max(...hepsi.map(n => zaman(n.tarih)));
  const fList = hepsi.map(n => parseFloat(n.fiyat));
  let f0 = Math.min(...fList), f1 = Math.max(...fList);
  const pay = Math.max((f1 - f0) * 0.15, f1 * 0.02);
  f0 -= pay; f1 += pay;

  const M = { sol: 64, sag: 16, ust: 14, alt: 26 };
  const px = t => t1 === t0 ? M.sol + (W - M.sol - M.sag) / 2
    : M.sol + (t - t0) / (t1 - t0) * (W - M.sol - M.sag);
  const py = f => M.ust + (f1 - f) / (f1 - f0) * (H - M.ust - M.alt);

  x.font = "11px sans-serif";
  x.textAlign = "right"; x.textBaseline = "middle";
  for (let i = 0; i <= 4; i++) {
    const f = f0 + (f1 - f0) * i / 4;
    const y = py(f);
    x.strokeStyle = rCizgi; x.lineWidth = 1;
    x.beginPath(); x.moveTo(M.sol, y); x.lineTo(W - M.sag, y); x.stroke();
    x.fillStyle = rSoluk;
    x.fillText(Math.round(f).toLocaleString("tr-TR"), M.sol - 8, y);
  }
  x.textAlign = "center"; x.textBaseline = "top";
  x.fillStyle = rSoluk;
  x.fillText(kisaTarih(new Date(t0).toISOString().slice(0,16).replace("T"," ")), M.sol + 30, H - M.alt + 8);
  x.fillText(kisaTarih(new Date(t1).toISOString().slice(0,16).replace("T"," ")), W - M.sag - 40, H - M.alt + 8);

  function seriCiz(liste, renk, kesikli, kalin) {
    if (!liste.length) return;
    x.strokeStyle = renk; x.lineWidth = kalin;
    x.setLineDash(kesikli ? [6, 5] : []);
    x.beginPath();
    liste.forEach((n, i) => {
      const X = px(zaman(n.tarih)), Y = py(parseFloat(n.fiyat));
      if (i === 0) x.moveTo(X, Y);
      else { x.lineTo(X, py(parseFloat(liste[i-1].fiyat))); x.lineTo(X, Y); }
    });
    const sonN = liste[liste.length - 1];
    x.lineTo(W - M.sag, py(parseFloat(sonN.fiyat)));
    x.stroke();
    x.setLineDash([]);
  }

  seriCiz(grupH, rSoluk, true, 1.5);
  seriCiz(etikH, "#e2a93b", true, 1.5);   // satici etiket fiyati
  seriCiz(urunH, rVurgu, false, 2.5);

  const kaynak = urunH.length ? urunH : grupH;
  const sonN = kaynak[kaynak.length - 1];
  const sy = py(parseFloat(sonN.fiyat));
  x.fillStyle = urunH.length ? rVurgu : rSoluk;
  x.beginPath(); x.arc(W - M.sag - 4, sy, 4, 0, Math.PI * 2); x.fill();
  x.textAlign = "right"; x.textBaseline = "bottom";
  x.font = "bold 12px sans-serif";
  x.fillText(tl(sonN.fiyat), W - M.sag - 10, sy - 6);

  // --- fare ipucu: en yakin tur cizgisi + tarih/fiyat kutusu ---
  const zamanlar = [...new Set(hepsi.map(n => zaman(n.tarih)))].sort((a, b) => a - b);
  if (isaret !== null) {
    const zx = px(isaret);
    x.strokeStyle = rSoluk; x.lineWidth = 1; x.setLineDash([3, 3]);
    x.beginPath(); x.moveTo(zx, M.ust); x.lineTo(zx, H - M.alt); x.stroke();
    x.setLineDash([]);
    const uN = sonDeger(urunH, isaret), gN = sonDeger(grupH, isaret);
    const satirlar = [kisaTarih(new Date(isaret).toISOString().slice(0, 16).replace("T", " "))];
    if (uN) satirlar.push("Ürün: " + tl(uN.fiyat));
    if (gN) satirlar.push("Grup: " + tl(gN.fiyat));
    const eN = sonDeger(etikH, isaret);
    if (eN) satirlar.push("Etiket: " + tl(eN.fiyat));
    x.font = "11px sans-serif";
    const gen = Math.max(...satirlar.map(s => x.measureText(s).width)) + 16;
    const yuk = satirlar.length * 15 + 10;
    let kx = zx + 10;
    if (kx + gen > W - M.sag) kx = zx - gen - 10;
    const ky = M.ust + 6;
    x.fillStyle = stil.getPropertyValue("--yuzey2").trim();
    x.strokeStyle = rCizgi; x.lineWidth = 1;
    x.fillRect(kx, ky, gen, yuk); x.strokeRect(kx, ky, gen, yuk);
    x.textAlign = "left"; x.textBaseline = "top";
    x.fillStyle = stil.getPropertyValue("--metin").trim();
    satirlar.forEach((s, i) => x.fillText(s, kx + 8, ky + 6 + i * 15));
  }
  c.onmousemove = e => {
    if (!zamanlar.length) return;
    const mx = e.offsetX;
    let enYakin = zamanlar[0];
    for (const z of zamanlar)
      if (Math.abs(px(z) - mx) < Math.abs(px(enYakin) - mx)) enYakin = z;
    if (enYakin !== isaret) grafikAc(kim, grupAnahtari, baslik, enYakin);
  };
  c.onmouseleave = () => { if (isaret !== null) grafikAc(kim, grupAnahtari, baslik, null); };
}

function temaKur() {
  const btn = document.getElementById("temaBtn");
  const uygula = acik => {
    document.body.classList.toggle("acik", acik);
    btn.textContent = acik ? "☾ Koyu tema" : "☀ Açık tema";
    try { localStorage.setItem("tema", acik ? "acik" : "koyu"); } catch {}
  };
  let kayitli = null;
  try { kayitli = localStorage.getItem("tema"); } catch {}
  uygula(kayitli === "acik");
  btn.addEventListener("click", () =>
    uygula(!document.body.classList.contains("acik")));
}

function sutunGenislet() {
  document.querySelectorAll("th .tutamac").forEach(t => {
    t.addEventListener("mousedown", e => {
      const th = t.parentElement, basX = e.pageX, basG = th.offsetWidth;
      const oynat = ev => th.style.width = Math.max(60, basG + ev.pageX - basX) + "px";
      const birak = () => { document.removeEventListener("mousemove", oynat);
                            document.removeEventListener("mouseup", birak); };
      document.addEventListener("mousemove", oynat);
      document.addEventListener("mouseup", birak);
      e.preventDefault();
    });
  });
}

baslat().catch(h => document.getElementById("sonGuncelleme").textContent =
  "Veri yüklenemedi: " + h.message);
</script>

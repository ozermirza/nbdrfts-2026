<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiyat Radarı</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #f4f5f7; color: #1c1e21; padding: 20px; }
  h1 { font-size: 22px; }
  .alt { color: #667; font-size: 13px; margin: 4px 0 16px; }
  .kartlar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .kart { background: #fff; border-radius: 10px; padding: 12px 16px;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); min-width: 140px; }
  .kart .sayi { font-size: 24px; font-weight: 600; }
  .kart .etiket { font-size: 12px; color: #667; }

  .duzen { display: flex; gap: 16px; align-items: flex-start; }
  .panel { background: #fff; border-radius: 10px; padding: 14px;
           box-shadow: 0 1px 3px rgba(0,0,0,.08); width: 210px; flex-shrink: 0;
           position: sticky; top: 12px; }
  .panel h3 { font-size: 12px; text-transform: uppercase; color: #667;
              margin: 10px 0 6px; }
  .panel h3:first-child { margin-top: 0; }
  .panel label { display: block; font-size: 13px; padding: 3px 0; cursor: pointer; }
  .kaldir { border: none; background: none; color: #4a6cf7; font-size: 11px;
            cursor: pointer; padding: 0; text-transform: none; }
  .kaldir:hover { text-decoration: underline; }
  .panel input[type=text] { width: 100%; padding: 7px 9px; border: 1px solid #ccd;
                            border-radius: 7px; font-size: 13px; margin-bottom: 4px; }

  .tabloKap { flex: 1; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: #fff;
          border-radius: 10px; overflow: hidden; table-layout: fixed;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  th { text-align: left; font-size: 12px; color: #667; padding: 10px 12px;
       border-bottom: 1px solid #eee; cursor: pointer; position: relative;
       user-select: none; white-space: nowrap; overflow: hidden; }
  th .tutamac { position: absolute; right: 0; top: 0; bottom: 0; width: 6px;
                cursor: col-resize; }
  td { padding: 9px 12px; border-bottom: 1px solid #f2f2f4; font-size: 14px;
       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr.detay td { background: #fafbfd; font-size: 13px; }
  tr.detay td:first-child { padding-left: 28px; color: #556; }
  .rozet { display: inline-block; padding: 2px 8px; border-radius: 6px;
           font-size: 12px; font-weight: 600; }
  .dusus { background: #e6f7ed; color: #137a3d; }
  .artis { background: #fdf3dc; color: #9a6b00; }
  .hata  { color: #b33; font-size: 12px; }
  .fiyat { font-weight: 600; }
  .fiyat a { color: inherit; }
  .adet { color: #889; font-size: 12px; font-weight: 400; }
</style>
</head>
<body>
  <h1>Fiyat Radarı</h1>
  <div class="alt" id="sonGuncelleme">Veri yükleniyor...</div>

  <div class="kartlar">
    <div class="kart"><div class="sayi" id="kGrup">–</div><div class="etiket">Ürün grubu</div></div>
    <div class="kart"><div class="sayi" id="kKayit">–</div><div class="etiket">Takip edilen kayıt</div></div>
    <div class="kart"><div class="sayi" id="kDusen">–</div><div class="etiket">Fiyatı düşen</div></div>
    <div class="kart"><div class="sayi" id="kArtan">–</div><div class="etiket">Fiyatı artan</div></div>
    <div class="kart"><div class="sayi" id="kHata">–</div><div class="etiket">Okunamayan</div></div>
  </div>

  <div class="duzen">
    <div class="panel" id="filtrePanel">
      <h3>Ara</h3>
      <input type="text" id="fAra" placeholder="seri, model, varyant...">
      <label><input type="checkbox" id="fDegisen"> Sadece değişenler</label>
      <h3>Marka <button class="kaldir" data-hedef="fMarka">seçimleri kaldır</button></h3>
      <div id="fMarka"></div>
      <h3>Platform <button class="kaldir" data-hedef="fPlatform">seçimleri kaldır</button></h3>
      <div id="fPlatform"></div>
      <h3>Hacim <button class="kaldir" data-hedef="fHacim">seçimleri kaldır</button></h3>
      <div id="fHacim"></div>
    </div>

    <div class="tabloKap">
      <table id="tablo">
        <thead><tr>
          <th data-k="marka">Marka<span class="tutamac"></span></th>
          <th data-k="seri_adi">Seri<span class="tutamac"></span></th>
          <th data-k="hacim">Hacim<span class="tutamac"></span></th>
          <th data-k="platform">Platform<span class="tutamac"></span></th>
          <th data-k="fiyat">Fiyat<span class="tutamac"></span></th>
          <th data-k="">Değişim / Detay<span class="tutamac"></span></th>
        </tr></thead>
        <tbody id="tabloGovde"></tbody>
      </table>
    </div>
  </div>

<script>
function csvOku(metin) {
  const satirlar = metin.trim().split("\n");
  const basliklar = satirlar[0].split(",");
  return satirlar.slice(1).map(s => {
    const d = s.split(","), k = {};
    basliklar.forEach((b, i) => k[b] = (d[i] || "").trim());
    return k;
  });
}
const tl = x => parseFloat(x).toLocaleString("tr-TR") + " TL";
const kimlik = k => [k.marka, k.seri_adi, k.varyant, k.hacim, k.platform].join("|");
const grupKimlik = k => [k.marka, k.seri_adi, k.hacim, k.platform].join("|");

// Linkten okunur model adi cikar: .../trixie-mrs-mouse-350ml -> "trixie mrs mouse 350ml"
function linktenModel(url) {
  try {
    const yol = new URL(url).pathname.split("/").filter(Boolean).pop() || "";
    return yol.split("?")[0].replace(/-/g, " ").replace(/\s+p \d+$/, "");
  } catch { return ""; }
}
// Varyant etiketi: anlamliysa varyant, degilse linkten model
function etiket(k) {
  const v = (k.varyant || "").trim();
  if (v && v.toLowerCase() !== "default title") return v;
  return linktenModel(k.url);
}

let gruplar = [], siralama = { k: null, yon: 1 };

async function baslat() {
  const kayitlar = csvOku(await (await fetch("fiyatlar.csv?" + Date.now())).text());
  const turlar = [...new Set(kayitlar.map(k => k.tarih))].sort();
  const sonTur = turlar.at(-1), oncekiTur = turlar.at(-2) || null;

  const son = kayitlar.filter(k => k.tarih === sonTur);
  const onceki = new Map(kayitlar.filter(k => k.tarih === oncekiTur)
                                 .map(k => [kimlik(k), k]));
  son.forEach(k => {
    k.yon = ""; k.oncekiFiyat = null;
    const e = onceki.get(kimlik(k));
    if (e && e.fiyat && k.fiyat) {
      const ef = parseFloat(e.fiyat), yf = parseFloat(k.fiyat);
      if (yf < ef) { k.yon = "dusus"; k.oncekiFiyat = ef; }
      if (yf > ef) { k.yon = "artis"; k.oncekiFiyat = ef; }
    }
  });

  // Gruplama: marka+seri+hacim+platform
  const sozluk = new Map();
  son.forEach(k => {
    if (!sozluk.has(grupKimlik(k))) sozluk.set(grupKimlik(k), []);
    sozluk.get(grupKimlik(k)).push(k);
  });
  gruplar = [...sozluk.values()].map(uyeler => {
    const ilk = uyeler[0];
    const fiyatli = uyeler.filter(u => u.fiyat);
    // Mod fiyat: en cok tekrar eden fiyat = grubun "normal" fiyati
    const sayac = {};
    fiyatli.forEach(u => sayac[u.fiyat] = (sayac[u.fiyat] || 0) + 1);
    const mod = Object.keys(sayac).sort((a, b) => sayac[b] - sayac[a])[0] || null;
    // Detaya dusecekler: mod disinda fiyati olan VEYA fiyati degisen varyantlar
    const detaylar = uyeler.filter(u => (u.fiyat && u.fiyat !== mod) || u.yon);
    return {
      marka: ilk.marka, seri_adi: ilk.seri_adi, hacim: ilk.hacim,
      platform: ilk.platform, fiyat: mod, adet: uyeler.length,
      durum: fiyatli.length ? "ok" : ilk.durum,
      url: ilk.url, uyeler, detaylar
    };
  });

  // Ozet kartlar
  document.getElementById("sonGuncelleme").textContent =
    "Son güncelleme: " + sonTur + " (robot 2 saatte bir tarar)";
  document.getElementById("kGrup").textContent = gruplar.length;
  document.getElementById("kKayit").textContent = son.length;
  document.getElementById("kDusen").textContent = son.filter(k => k.yon === "dusus").length;
  document.getElementById("kArtan").textContent = son.filter(k => k.yon === "artis").length;
  document.getElementById("kHata").textContent = son.filter(k => k.durum !== "ok").length;

  // Filtre kutucuklari
  const kutular = (id, degerler) => {
    const kap = document.getElementById(id);
    [...new Set(degerler)].sort().forEach(d => {
      const l = document.createElement("label");
      l.innerHTML = `<input type="checkbox" value="${d}" checked> ${d}`;
      kap.appendChild(l);
    });
  };
  kutular("fMarka", gruplar.map(g => g.marka));
  kutular("fHacim", gruplar.map(g => g.hacim));
  kutular("fPlatform", gruplar.map(g => g.platform));
  document.getElementById("filtrePanel").addEventListener("input", ciz);
  document.querySelectorAll("th[data-k]").forEach(th =>
    th.addEventListener("click", e => {
      if (e.target.classList.contains("tutamac") || !th.dataset.k) return;
      siralama.yon = siralama.k === th.dataset.k ? -siralama.yon : 1;
      siralama.k = th.dataset.k; ciz();
    }));

  // "Secimleri kaldir" dugmeleri: ilk basista tumunu kaldirir,
  // hepsi zaten kapaliysa tumunu geri acar (sifirla gibi calisir)
  document.querySelectorAll(".kaldir").forEach(btn =>
    btn.addEventListener("click", () => {
      const kutucuklar = document.querySelectorAll(`#${btn.dataset.hedef} input`);
      const hepsiKapali = [...kutucuklar].every(k => !k.checked);
      kutucuklar.forEach(k => k.checked = hepsiKapali);
      ciz();
    }));

  sutunGenislet();
  ciz();
}

function secili(id) {
  return [...document.querySelectorAll(`#${id} input:checked`)].map(i => i.value);
}

function ciz() {
  const m = secili("fMarka"), h = secili("fHacim"), p = secili("fPlatform");
  const ara = document.getElementById("fAra").value.toLowerCase();
  const sadeceDegisen = document.getElementById("fDegisen").checked;

  let liste = gruplar.filter(g =>
    m.includes(g.marka) && h.includes(g.hacim) && p.includes(g.platform) &&
    (!sadeceDegisen || g.detaylar.some(d => d.yon)) &&
    (!ara || (g.marka + " " + g.seri_adi + " " +
              g.uyeler.map(etiket).join(" ")).toLowerCase().includes(ara))
  );
  if (siralama.k) {
    liste = [...liste].sort((a, b) => {
      const x = a[siralama.k] || "", y = b[siralama.k] || "";
      const nx = parseFloat(x), ny = parseFloat(y);
      const s = (!isNaN(nx) && !isNaN(ny)) ? nx - ny : String(x).localeCompare(String(y), "tr");
      return s * siralama.yon;
    });
  }

  document.getElementById("tabloGovde").innerHTML = liste.map(g => {
    const fiyatH = g.fiyat
      ? `<a href="${g.url}" target="_blank">${tl(g.fiyat)}</a>`
      : `<span class="hata">${g.durum}</span>`;
    let satirlar = `<tr>
      <td>${g.marka}</td><td>${g.seri_adi}</td><td>${g.hacim}</td>
      <td>${g.platform}</td>
      <td class="fiyat">${fiyatH} <span class="adet">(${g.adet} varyant)</span></td>
      <td>${g.detaylar.length ? `<span class="adet">${g.detaylar.length} istisna ↓</span>` : ""}</td>
    </tr>`;
    g.detaylar.forEach(d => {
      let rozet = "";
      if (d.yon === "dusus") rozet = `<span class="rozet dusus">▼ ${tl(d.oncekiFiyat)} → ${tl(d.fiyat)}</span>`;
      if (d.yon === "artis") rozet = `<span class="rozet artis">▲ ${tl(d.oncekiFiyat)} → ${tl(d.fiyat)}</span>`;
      if (!rozet && d.fiyat) rozet = `<span class="adet">grup fiyatından farklı</span>`;
      satirlar += `<tr class="detay">
        <td>↳ model</td><td colspan="3">${etiket(d)}</td>
        <td class="fiyat"><a href="${d.url}" target="_blank">${d.fiyat ? tl(d.fiyat) : d.durum}</a></td>
        <td>${rozet}</td></tr>`;
    });
    return satirlar;
  }).join("");
}

// Sutun genisligi surukleme (Excel usulu)
function sutunGenislet() {
  document.querySelectorAll("th .tutamac").forEach(t => {
    t.addEventListener("mousedown", e => {
      const th = t.parentElement, basX = e.pageX, basG = th.offsetWidth;
      const oynat = ev => th.style.width = Math.max(60, basG + ev.pageX - basX) + "px";
      const birak = () => { document.removeEventListener("mousemove", oynat);
                            document.removeEventListener("mouseup", birak); };
      document.addEventListener("mousemove", oynat);
      document.addEventListener("mouseup", birak);
      e.preventDefault();
    });
  });
}

baslat().catch(h => document.getElementById("sonGuncelleme").textContent =
  "Veri yüklenemedi: " + h.message);
</script>
</body>
</html>

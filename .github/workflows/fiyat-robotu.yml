# FIYAT RADARI - GitHub Actions talimat dosyasi
name: Fiyat robotu
on:
  # Zamanlama UTC ile yazilir. Turkiye = UTC+3.
  # "0 5-19/2 * * *" -> TR saatiyle 08:00-22:00 arasi 2 saatte bir calis.
  schedule:
    - cron: "0 5-19/2 * * *"
  # Actions sekmesinden elle baslatma dugmesi (testler icin):
  workflow_dispatch:
# Robotun sonuc dosyasini repoya kaydedebilmesi icin yazma izni:
permissions:
  contents: write
jobs:
  fiyat-cek:
    runs-on: ubuntu-latest   # GitHub gecici bir Linux bilgisayar acar
    steps:
      - uses: actions/checkout@v4          # repoyu indir
      - uses: actions/setup-python@v5      # Python kur
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: playwright install --with-deps chromium
      - run: python scraper.py             # robotu calistir
      - name: Sonuclari kaydet             # fiyatlar.csv'yi repoya isle
        run: |
          git config user.name "fiyat-robotu"
          git config user.email "robot@users.noreply.github.com"
          git add fiyatlar.csv
          git diff --cached --quiet || git commit -m "Otomatik fiyat guncellemesi"
          git push

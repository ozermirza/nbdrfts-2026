# FIYAT RADARI - GitHub Actions talimat dosyasi
name: Fiyat robotu
on:
  # Zamanlama UTC ile yazilir. Turkiye = UTC+3.
  # "23 3-21 * * *" -> TR saatiyle 06:23-00:23 arasi her saat XX:23.
  schedule:
    - cron: "23 3-21 * * *"
  # Actions sekmesinden elle baslatma dugmesi (testler icin):
  workflow_dispatch:
# Robotun sonuc dosyalarini repoya kaydedebilmesi icin yazma izni:
permissions:
  contents: write
jobs:
  fiyat-cek:
    runs-on: ubuntu-latest   # GitHub gecici bir Linux bilgisayar acar
    steps:
      - uses: actions/checkout@v4          # repoyu indir
      - uses: actions/setup-python@v5      # Python kur
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: playwright install --with-deps chromium
      # surum 22: HB gorunur pencere ister -> xvfb sanal ekran
      - run: xvfb-run --auto-servernum python scraper.py
      - name: Sonuclari kaydet
        run: |
          git config user.name "fiyat-robotu"
          git config user.email "robot@users.noreply.github.com"
          git add fiyatlar.csv yetiskin_fiyatlar.csv hb_fiyatlar.csv
          git add arsiv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Otomatik fiyat guncellemesi"
          git pull --rebase origin main || (sleep 20 && git pull --rebase origin main)
          git push || (sleep 20 && git push)

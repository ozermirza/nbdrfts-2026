# FIYAT RADARI - Teshis araci talimat dosyasi
name: Teshis araci
on:
  workflow_dispatch:
  schedule:
    - cron: "23 17,20 * * *"
permissions:
  contents: write
jobs:
  teshis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum python teshis.py
      - name: Deneme dosyasini kaydet
        run: |
          git config user.name "fiyat-robotu"
          git config user.email "robot@users.noreply.github.com"
          git add deneme_hb.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "HB istikrar sinavi"
          git pull --rebase origin main || (sleep 20 && git pull --rebase origin main)
          git push || (sleep 20 && git push)
